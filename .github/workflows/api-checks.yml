name: API Checks

on:
  pull_request:
    branches:
      - dev

jobs:
  api-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bl/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bl/api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black mypy

      - name: Black
        run: black --check src

      - name: Mypy
        run: mypy --ignore-missing-imports src

      - name: Pytest
        run: pytest
