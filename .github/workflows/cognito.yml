# Provisions the fresh cloud Cognito pool (terraform/cognito), extracted from the
# retiring terraform/dev stack. workflow_dispatch-ONLY (manual) — the pool is
# near-static and must never be coupled to app deploys. Its outputs are set as
# GitHub secrets for the GCP deploy (see terraform/GCP_MIGRATION.md).
name: Cognito Pool (alpha)

on:
  workflow_dispatch:

jobs:
  apply:
    name: Provision fresh Cognito pool
    runs-on: ubuntu-latest

    env:
      TF_VAR_admin_password: ${{ secrets.ADMIN_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.6"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2

      - name: Terraform Init
        working-directory: terraform/cognito
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform/cognito
        run: terraform apply -auto-approve

      - name: Print pool ids (set these as GitHub secrets)
        working-directory: terraform/cognito
        run: |
          {
            echo "**Fresh Cognito pool provisioned.** Set these as repo secrets for the GCP deploy:"
            echo ""
            echo "- \`USER_POOL_ID\` **and** \`COGNITO_ADMIN_POOL_ID\` = \`$(terraform output -raw user_pool_id)\`"
            echo "- \`COGNITO_CLIENT_ID\` = \`$(terraform output -raw cognito_client_id)\`"
            echo "- \`ADMIN_COGNITO_CLIENT_ID\` **and** \`COGNITO_ADMIN_CLIENT_ID\` = \`$(terraform output -raw admin_client_id)\`"
            echo ""
            echo "\`ADMIN_COGNITO_CLIENT_SECRET\` is sensitive and is NOT printed here."
            echo "Read it locally and set it:"
            echo '```'
            echo "cd terraform/cognito && terraform init && gh secret set ADMIN_COGNITO_CLIENT_SECRET --body \"\$(terraform output -raw admin_client_secret)\""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
