name: Dev Checks and Deploy

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    name: Deploy Infrastructure and Application
    runs-on: ubuntu-latest

    env:
      TF_VAR_image_tag: ${{ github.sha }}
      TF_VAR_rapid_api_key: ${{ secrets.RAPID_API_KEY }}
      TF_VAR_admin_session_secret: ${{ secrets.ADMIN_SESSION_SECRET }}
      TF_VAR_admin_password: ${{ secrets.ADMIN_PASSWORD }}
      TF_VAR_vercel_api_token: ${{ secrets.VERCEL_API_TOKEN }}
      TF_VAR_vercel_project_id: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.0"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2

      - name: Terraform Init
        working-directory: terraform/dev
        run: terraform init

      - name: Terraform Plan (ECR only)
        working-directory: terraform/dev
        run: |
          terraform plan -target=module.apprunner.aws_ecr_repository.api

      - name: Terraform Apply (ECR only first)
        working-directory: terraform/dev
        run: |
          terraform apply -auto-approve -target=module.apprunner.aws_ecr_repository.api

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get ECR repository URL
        id: get-ecr
        working-directory: terraform/dev
        run: |
          ECR_REPO=$(terraform output -raw ecr_repository_url)
          echo "ecr_repo=$ECR_REPO" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        env:
          ECR_REPO: ${{ steps.get-ecr.outputs.ecr_repo }}
          IMAGE_TAG: ${{ github.sha }}
        working-directory: api
        run: |
          docker build -t $ECR_REPO:$IMAGE_TAG .
          docker push $ECR_REPO:$IMAGE_TAG

      - name: Terraform Plan (Full)
        working-directory: terraform/dev
        run: terraform plan

      - name: Terraform Apply (Full)
        working-directory: terraform/dev
        run: terraform apply -auto-approve

      - name: Set Cognito admin callback URL
        working-directory: terraform/dev
        run: |
          POOL=$(terraform output -raw admin_pool_id)
          CLIENT=$(terraform output -raw admin_client_id)
          APPRUNNER_HOST=$(terraform output -raw apprunner_service_url)
          # update-user-pool-client does a FULL replace of the client config, so the OAuth flags
          # must be re-passed or they reset. These flags MUST stay in sync with the oauth attributes
          # on the aws_cognito_user_pool_client.admin_client resource in terraform/modules/cognito.
          aws cognito-idp update-user-pool-client \
            --region eu-west-2 \
            --user-pool-id "$POOL" \
            --client-id "$CLIENT" \
            --callback-urls "https://$APPRUNNER_HOST/auth/callback" \
            --logout-urls "https://$APPRUNNER_HOST" \
            --allowed-o-auth-flows code \
            --allowed-o-auth-scopes openid email profile \
            --allowed-o-auth-flows-user-pool-client \
            --supported-identity-providers COGNITO \
            > /dev/null

      - name: Output Service URL
        working-directory: terraform/dev
        run: |
          echo "**Service URL:** $(terraform output -raw apprunner_service_url)" >> $GITHUB_STEP_SUMMARY

      - name: Trigger Vercel frontend rebuild
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL" > /dev/null
          echo "Triggered Vercel frontend rebuild" >> $GITHUB_STEP_SUMMARY
