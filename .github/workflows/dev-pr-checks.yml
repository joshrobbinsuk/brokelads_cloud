name: Dev PR Checks

on:
  pull_request:
    branches:
      - dev

jobs:
  api-checks:
    name: API Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bl/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bl/api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy

      - name: Mypy
        run: mypy --config-file mypy.ini

      - name: Pytest
        run: pytest
