# Deploys the GCP app stack (terraform/gcp/dev) on push to `dev`.
# Auth is keyless WIF (google-github-actions/auth), pinned to this repo +
# branch by the tf_bootstrap gcp/ root — see terraform/GCP_MIGRATION.md.
#
# Required GitHub secrets (repo settings > Secrets and variables > Actions):
#   Already set (reused from the AWS deploy):
#     RAPID_API_KEY, OPENAI_API_KEY, ADMIN_SESSION_SECRET,
#     AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, VERCEL_DEPLOY_HOOK_URL
#   NEW — must be set before the first deploy:
#     NEON_API_KEY                 — Neon API key (already confirmed set)
#     CRON_AUTH_KEY                — was generated inside the AWS scheduler module;
#                                     the GCP stack takes it as a CI-fed secret instead
#     USER_POOL_ID                 — from the fresh Cognito stack (see GCP_MIGRATION.md)
#     COGNITO_CLIENT_ID            — from the fresh Cognito stack
#     ADMIN_COGNITO_CLIENT_ID      — from the fresh Cognito stack
#     ADMIN_COGNITO_CLIENT_SECRET  — from the fresh Cognito stack
#   NEW — only needed once the admin-callback patch step is live (currently
#   gated to no-op if unset; see the TODO on that step):
#     COGNITO_ADMIN_POOL_ID, COGNITO_ADMIN_CLIENT_ID

name: GCP Dev Deploy

on:
  push:
    branches:
      - dev

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy GCP App Stack (dev)
    runs-on: ubuntu-latest

    env:
      TF_VAR_gcp_project_id: brokelads
      TF_VAR_neon_api_key: ${{ secrets.NEON_API_KEY }}
      TF_VAR_rapid_api_key: ${{ secrets.RAPID_API_KEY }}
      TF_VAR_openai_api_key: ${{ secrets.OPENAI_API_KEY }}
      TF_VAR_cron_auth_key: ${{ secrets.CRON_AUTH_KEY }}
      TF_VAR_admin_session_secret: ${{ secrets.ADMIN_SESSION_SECRET }}
      TF_VAR_admin_cognito_client_secret: ${{ secrets.ADMIN_COGNITO_CLIENT_SECRET }}
      TF_VAR_aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      TF_VAR_aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_VAR_user_pool_id: ${{ secrets.USER_POOL_ID }}
      TF_VAR_cognito_client_id: ${{ secrets.COGNITO_CLIENT_ID }}
      TF_VAR_admin_cognito_client_id: ${{ secrets.ADMIN_COGNITO_CLIENT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/526938691325/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: gh-actions-deployer@526938691325.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west2-docker.pkg.dev --quiet

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.6"

      - name: Terraform Init
        working-directory: terraform/gcp/dev
        run: terraform init -backend-config="bucket=526938691325-terraform-state"

      - name: Terraform Plan (Artifact Registry only)
        working-directory: terraform/gcp/dev
        run: |
          terraform plan \
            -target=module.app.google_project_service.apis \
            -target=module.app.google_artifact_registry_repository.api

      - name: Terraform Apply (Artifact Registry only first)
        working-directory: terraform/gcp/dev
        run: |
          terraform apply -auto-approve \
            -target=module.app.google_project_service.apis \
            -target=module.app.google_artifact_registry_repository.api

      - name: Get Artifact Registry image ref
        id: get-image
        working-directory: terraform/gcp/dev
        run: |
          REPO=$(terraform output -raw artifact_registry_repository)
          IMAGE="europe-west2-docker.pkg.dev/brokelads/$REPO/api:${{ github.sha }}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        env:
          IMAGE: ${{ steps.get-image.outputs.image }}
        working-directory: api
        run: |
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Terraform Plan (Full)
        working-directory: terraform/gcp/dev
        run: terraform plan -var "image=${{ steps.get-image.outputs.image }}"

      - name: Terraform Apply (Full)
        working-directory: terraform/gcp/dev
        run: terraform apply -auto-approve -var "image=${{ steps.get-image.outputs.image }}"

      # TODO: from the fresh Cognito stack — COGNITO_ADMIN_POOL_ID / COGNITO_ADMIN_CLIENT_ID
      # don't exist yet (Cognito is being extracted into its own standalone AWS stack, see
      # GCP_MIGRATION.md). Both steps below no-op until those secrets are set.
      - name: Configure AWS credentials (Cognito admin patch)
        if: ${{ secrets.COGNITO_ADMIN_POOL_ID != '' && secrets.COGNITO_ADMIN_CLIENT_ID != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2

      - name: Set Cognito admin callback URL
        if: ${{ secrets.COGNITO_ADMIN_POOL_ID != '' && secrets.COGNITO_ADMIN_CLIENT_ID != '' }}
        working-directory: terraform/gcp/dev
        run: |
          CLOUD_RUN_URL=$(terraform output -raw cloud_run_url)
          # update-user-pool-client does a FULL replace of the client config, so the OAuth flags
          # must be re-passed or they reset. These flags MUST stay in sync with the oauth attributes
          # on the fresh Cognito stack's admin app client.
          aws cognito-idp update-user-pool-client \
            --region eu-west-2 \
            --user-pool-id "${{ secrets.COGNITO_ADMIN_POOL_ID }}" \
            --client-id "${{ secrets.COGNITO_ADMIN_CLIENT_ID }}" \
            --callback-urls "$CLOUD_RUN_URL/auth/callback" \
            --logout-urls "$CLOUD_RUN_URL" \
            --allowed-o-auth-flows code \
            --allowed-o-auth-scopes openid email profile \
            --allowed-o-auth-flows-user-pool-client \
            --supported-identity-providers COGNITO \
            > /dev/null

      - name: Output Service URL
        working-directory: terraform/gcp/dev
        run: |
          echo "**Cloud Run URL:** $(terraform output -raw cloud_run_url)" >> $GITHUB_STEP_SUMMARY

      - name: Trigger Vercel frontend rebuild
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL" > /dev/null
          echo "Triggered Vercel frontend rebuild" >> $GITHUB_STEP_SUMMARY
