version: "3.8"

services:
  db:
    image: postgres:16
    container_name: bl-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bl_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: bl-api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/bl_dev
      ENVIRONMENT: dev
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
      RAPID_API_KEY: ${RAPID_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      PUNDIT_UNLIMITED_EMAILS: ${PUNDIT_UNLIMITED_EMAILS-joshrobbinsukdev+test@gmail.com}
      CRON_AUTH_KEY: ${CRON_AUTH_KEY}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET}
      # Local-only: waves you into /admin without the Google OIDC dance. Never set in
      # Terraform, so cloud always runs the real AdminAuth.
      LOCAL_ADMIN_BYPASS: "1"
      # Admin panel = Google OIDC in the cloud; supply a Google OAuth client here to
      # exercise the real login locally (LOCAL_ADMIN_BYPASS otherwise skips it).
      ADMIN_GOOGLE_CLIENT_ID: ${ADMIN_GOOGLE_CLIENT_ID-}
      ADMIN_GOOGLE_CLIENT_SECRET: ${ADMIN_GOOGLE_CLIENT_SECRET-}
      # Auth is the Firebase Auth emulator locally — fake, seedable, no real emails.
      # firebase-admin honours FIREBASE_AUTH_EMULATOR_HOST natively (accepts the
      # emulator's unsigned tokens; never set this in the cloud).
      GOOGLE_CLOUD_PROJECT: demo-brokelads
      FIREBASE_AUTH_EMULATOR_HOST: firebase-auth:9099
      # For `python -m src.dev.seed emulator-user`: the e2e user seeded into the
      # emulator. Email is not secret; password comes from the host env (bl-fe/.env.e2e).
      E2E_TEST_EMAIL: ${E2E_TEST_EMAIL-joshrobbinsukdev+test@gmail.com}
      E2E_TEST_PASSWORD: ${E2E_TEST_PASSWORD-}
    command: sh -c "alembic upgrade head && uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      firebase-auth:
        condition: service_started
    volumes:
      - ./api:/app

  firebase-auth:
    build:
      context: ./docker/firebase-emulator
    container_name: bl-firebase-auth
    ports:
      - "9099:9099"

volumes:
  postgres_data:
