version: "3.8"

services:
  db:
    image: postgres:16
    container_name: bl-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bl_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: bl-api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/bl_dev
      ENVIRONMENT: dev
      RAPID_API_KEY: ${RAPID_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      PUNDIT_UNLIMITED_EMAILS: ${PUNDIT_UNLIMITED_EMAILS-joshrobbinsukdev+test@gmail.com}
      CRON_AUTH_KEY: ${CRON_AUTH_KEY}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET}
      # Local admin OAuth login also needs a http://localhost callback registered on the admin
      # client; that is out of scope here (deploy patches the App Runner callback, not localhost).
      ADMIN_COGNITO_CLIENT_ID: ${ADMIN_COGNITO_CLIENT_ID}
      ADMIN_COGNITO_CLIENT_SECRET: ${ADMIN_COGNITO_CLIENT_SECRET}
      COGNITO_CLIENT_ID: 2mg2ph3ir84leu2s42pramgjfd
      USER_POOL_ID: eu-west-2_HSV4yaBye
    command: sh -c "alembic upgrade head && uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./api:/app

volumes:
  postgres_data:
